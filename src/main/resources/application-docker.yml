server:
  port: 8080
  servlet:
    context-path: /

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        enabled: ${AI_ENABLED:false}
        options:
          model: gpt-4o-mini
      embedding:
        enabled: ${AI_ENABLED:false}
      image:
        enabled: ${AI_ENABLED:false}
      audio:
        transcription:
          enabled: ${AI_ENABLED:false}
        speech:
          enabled: ${AI_ENABLED:false}
  application:
    name: EventEase

  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-db:3306/eventease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:eventease_user}
    password: ${DB_PASSWORD:eventease_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: eventease-notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.eventease.event

app:
  jwt:
    secret: ${JWT_SECRET}
  rate-limit:
    authenticated-rpm: ${RATE_LIMIT_AUTH_RPM:20}
    anonymous-rpm: ${RATE_LIMIT_ANON_RPM:10}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: EventEase

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
  retry:
    instances:
      paymentService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
